    <section id="activateView" class="login-shell hidden">
      <div class="login-brand">
        <div class="brand-mark">
          <span class="brand-symbol"><i data-lucide="waypoints"></i></span>
          <span class="brand-name">XFCloud Tunnel</span>
        </div>
        <div>
          <h1>激活你的账户</h1>
          <p>首次登录需要修改初始密码，激活后才能创建和使用隧道。</p>
        </div>
      </div>
      <div class="login-panel">
        <form id="activateForm" class="login-form">
          <h2>首次登录 · 强制激活</h2>
          <p>请修改服务端分配的初始密码</p>
          <div class="field">
            <label for="activateCurrentPassword">当前密码</label>
            <input
              id="activateCurrentPassword"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="field">
            <label for="activateNewPassword">新密码</label>
            <input
              id="activateNewPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="field">
            <label for="activateConfirmPassword">确认新密码</label>
            <input
              id="activateConfirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="field">
            <label for="activateNewUsername">昵称 / 用户名（可选，仅展示）</label>
            <input
              id="activateNewUsername"
              type="text"
              autocomplete="off"
              placeholder="留空则不修改；登录请使用 6 位用户 ID"
              spellcheck="false"
            />
          </div>
          <p id="activateError" class="error-text" role="alert"></p>
          <button class="button" type="submit">
            <i data-lucide="shield-check" class="icon"></i>
            激活并进入控制台
          </button>
        </form>
      </div>
      <footer class="record-footer login-record">
        <span><a class="footer-brand">XFCloud Tunnel</a></span>
      </footer>
    </section>
